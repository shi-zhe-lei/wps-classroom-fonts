<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">WPS Classroom Fonts</title>
  <desc id="desc">Offline fonts for clearer lessons. Math, language, and symbols.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#112638"/><stop offset="1" stop-color="#1d4f59"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#7ce8ce"/><stop offset="1" stop-color="#c8f5dd"/></linearGradient>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="1220" cy="15" r="240" fill="#ffffff" opacity=".035"/>
  <circle cx="1085" cy="355" r="185" fill="#ffffff" opacity=".035"/>
  <path d="M70 66h44" stroke="#86e5cf" stroke-width="5" stroke-linecap="round"/>
  <text x="70" y="109" fill="#a3d9d2" font-family="Arial, sans-serif" font-size="15" letter-spacing="4">MADE FOR THE CLASSROOM</text>
  <text x="66" y="177" fill="#ffffff" font-family="Arial, sans-serif" font-size="54" font-weight="700">WPS Classroom Fonts</text>
  <text x="70" y="219" fill="#c8dadd" font-family="Arial, sans-serif" font-size="23">Offline fonts for clearer lessons.</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#b8e8db">
    <rect x="70" y="267" width="103" height="34" rx="17" fill="#ffffff" opacity=".08"/><text x="93" y="289">LINUX</text>
    <rect x="185" y="267" width="129" height="34" rx="17" fill="#ffffff" opacity=".08"/><text x="207" y="289">OFFLINE</text>
    <rect x="326" y="267" width="151" height="34" rx="17" fill="#ffffff" opacity=".08"/><text x="350" y="289">REVERSIBLE</text>
  </g>
  <rect x="966" y="78" width="215" height="211" rx="22" fill="#ffffff" opacity=".07" stroke="#b2f6dd"/>
  <text x="997" y="163" fill="url(#accent)" font-family="Georgia, serif" font-size="61">∑</text>
  <text x="1090" y="160" fill="#e4f4ef" font-family="Georgia, serif" font-size="48">Aa</text>
  <path d="M999 186h148" stroke="#b2d9d0" opacity=".4"/>
  <!-- Draw the radical and overbar together so font fallback cannot detach them. -->
  <path d="M999 231 L1006 227 L1015 249 L1028 208 H1056" fill="none" stroke="#e4f4ef" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1031" y="247" fill="#e4f4ef" font-family="Georgia, serif" font-size="43">x + y</text>
</svg>
